[project]
name = "ariadne"
version = "0.2.0"
description = "Personal open-source agent kernel — CLI shell agent first."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["rich>=13", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "playwright>=1.45"]

[project.scripts]
ariadne = "ariadne.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ariadne"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
