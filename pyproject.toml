[project]
name = "ariadne"
version = "0.1.0"
description = "Personal open-source agent kernel — CLI shell agent first."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ariadne = "ariadne.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ariadne"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
