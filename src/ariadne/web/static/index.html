<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ariadne</title>
<script>
(function () {
  try {
    var t = localStorage.getItem('ariadne_theme');
    if (t !== 'light' && t !== 'dark') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
<style>
  :root, [data-theme="dark"] {
    --bg: #000000;
    --bg-2: #0a0a0a;
    --bg-3: #111111;
    --bg-hover: #1a1a1a;
    --fg: #f5f5f5;
    --fg-2: #e5e5e5;
    --dim: #8a8a8a;
    --muted: #5c5c5c;
    --line: #222;
    --line-2: #2a2a2a;
    --btn: #ffffff;
    --btn-fg: #000000;
    --btn-hover: #e8e8e8;
    --btn-disabled-bg: #333333;
    --btn-disabled-fg: #777777;
    --code-bg: #1a1a1a;
    --pre-bg: #0d0d0d;
    --scroll: #2a2a2a;
    --shadow: 0 12px 40px rgba(0,0,0,.45);
    --modal-scrim: rgba(0,0,0,.55);
    --blue: #1d9bf0;
    --ok: #00ba7c;
    --warn: #ffad1f;
    --err: #f4212e;
    --gold: #c9a227;
    --radius: 24px;
    --sidebar-w: 280px;
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #f7f7f8;
    --bg-2: #ffffff;
    --bg-3: #ffffff;
    --bg-hover: #eef0f3;
    --fg: #0f1419;
    --fg-2: #1a1a1a;
    --dim: #536471;
    --muted: #8b98a5;
    --line: #e5e7eb;
    --line-2: #d0d5dd;
    --btn: #0f1419;
    --btn-fg: #ffffff;
    --btn-hover: #2a2a2a;
    --btn-disabled-bg: #d0d5dd;
    --btn-disabled-fg: #6b7280;
    --code-bg: #eef0f3;
    --pre-bg: #f0f2f5;
    --scroll: #c5cad3;
    --shadow: 0 12px 40px rgba(15,20,25,.08);
    --modal-scrim: rgba(15,20,25,.35);
    --blue: #1d9bf0;
    --ok: #00a06a;
    --warn: #b58105;
    --err: #cf1f2b;
    --gold: #a07d12;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    transition: background .2s ease, color .2s ease;
  }
  .hidden { display: none !important; }
  button, input, textarea { font: inherit; color: inherit; }
  button {
    border: 0; cursor: pointer; background: transparent;
    transition: background .12s, opacity .12s, transform .08s;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:active:not(:disabled) { transform: scale(.98); }

  /* ── Auth (centered card) ── */
  #auth {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background:
      radial-gradient(800px 400px at 50% -10%, rgba(255,255,255,.06), transparent 60%),
      var(--bg);
  }
  .auth-card {
    width: min(400px, 100%);
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 28px 28px;
  }
  .auth-card .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--btn); color: var(--btn-fg);
    display: grid; place-items: center;
    font-weight: 800; font-size: 20px; margin-bottom: 18px;
  }
  .auth-card h1 { margin: 0 0 6px; font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
  .auth-card .tag { color: var(--dim); font-size: 14px; margin: 0 0 24px; line-height: 1.45; }
  .auth-card input {
    width: 100%; padding: 12px 14px; margin: 0 0 10px;
    background: var(--bg); border: 1px solid var(--line-2); border-radius: 12px; outline: none;
  }
  .auth-card input:focus { border-color: var(--muted); }
  .auth-actions { display: flex; gap: 10px; margin-top: 8px; }
  .auth-actions button { flex: 1; padding: 12px; border-radius: 999px; font-weight: 600; }
  .btn-primary { background: var(--btn); color: var(--btn-fg); }
  .btn-primary:hover { background: var(--btn-hover); }
  .btn-secondary { background: transparent; border: 1px solid var(--line-2) !important; color: var(--fg); }
  .btn-secondary:hover { background: var(--bg-hover); }
  .warn { color: var(--warn); font-size: 13px; min-height: 1.2em; margin: 12px 0 0; }

  /* ── App: sidebar + main (Grok-like) ── */
  #app {
    display: flex; height: 100vh; height: 100dvh; overflow: hidden;
  }
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--bg-2);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    transition: margin .2s ease, opacity .2s;
  }
  #sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-w)); opacity: 0; pointer-events: none; }
  .sb-top {
    padding: 14px 12px 8px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .sb-brand {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px; font-weight: 700; letter-spacing: -.02em;
  }
  .sb-brand .mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--btn); color: var(--btn-fg); display: grid; place-items: center;
    font-size: 14px; font-weight: 800;
  }
  #session-new {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--line-2); color: var(--fg); font-weight: 560;
  }
  #session-new:hover { background: var(--bg-hover); }
  #session-new .plus {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--btn); color: var(--btn-fg);
    display: grid; place-items: center; font-size: 16px; line-height: 1; font-weight: 600;
  }
  .sb-section {
    padding: 8px 12px 4px;
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em; font-weight: 600;
  }
  #sess-list {
    flex: 1; overflow-y: auto; padding: 4px 8px 12px;
  }
  #sess-list::-webkit-scrollbar { width: 6px; }
  #sess-list::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  .sess-row {
    width: 100%; text-align: left;
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 10px; border-radius: 12px;
    margin-bottom: 2px; color: var(--fg-2);
  }
  .sess-row:hover { background: var(--bg-hover); }
  .sess-row.active { background: var(--bg-3); }
  .sess-row .body { flex: 1; min-width: 0; }
  .sess-row .preview {
    font-size: 13.5px; line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sess-row .meta {
    font-size: 11px; color: var(--muted); margin-top: 3px;
  }
  .sess-row .del {
    opacity: 0; padding: 4px 8px; border-radius: 8px;
    color: var(--dim); font-size: 12px; flex-shrink: 0;
  }
  .sess-row:hover .del { opacity: 1; }
  .sess-row .del:hover { background: rgba(244,33,46,.15); color: var(--err); }
  .sb-empty { padding: 16px 12px; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .sb-bottom {
    border-top: 1px solid var(--line);
    padding: 10px 8px 12px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .sb-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 10px 10px; border-radius: 12px;
    color: var(--fg-2); font-size: 13.5px; text-align: left;
  }
  .sb-item:hover { background: var(--bg-hover); }
  .sb-item .ico {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--bg-3); border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 13px; color: var(--dim);
  }
  .sb-item .sub { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
  #who { font-weight: 560; }
  #provider { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Main column */
  #main {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    background: var(--bg);
    position: relative;
  }
  .topbar {
    height: 52px; flex-shrink: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 0 16px;
  }
  #sidebar-toggle {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center; color: var(--dim);
  }
  #sidebar-toggle:hover { background: var(--bg-hover); color: var(--fg); }
  .topbar .title {
    font-weight: 600; font-size: 15px; letter-spacing: -.01em;
  }
  .topbar .spacer { flex: 1; }
  #session-chip {
    font-size: 12px; color: var(--muted); font-family: var(--mono);
    padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line);
  }
  #provider-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 6px 10px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ok);
  }
  #provider-chip.off { color: var(--warn); }
  #provider-chip .dot {
    width: 6px; height: 6px; border-radius: 50%; background: currentColor;
  }

  /* Chat */
  #chat {
    flex: 1; overflow-y: auto;
    scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }
  .chat-inner {
    max-width: 760px; margin: 0 auto;
    padding: 12px 20px 8px;
    min-height: 100%;
    display: flex; flex-direction: column; gap: 22px;
  }
  .chat-inner.has-empty {
    justify-content: center; min-height: calc(100% - 8px);
  }

  .empty-hint {
    text-align: center; padding: 24px 12px 8px; color: var(--dim);
  }
  .empty-hint .thread-art {
    width: 56px; height: 56px; margin: 0 auto 18px;
    border-radius: 16px; background: var(--btn); color: var(--btn-fg);
    display: grid; place-items: center; font-size: 26px; font-weight: 800;
  }
  .empty-hint h2 {
    margin: 0 0 10px; font-size: 1.75rem; font-weight: 650;
    color: var(--fg); letter-spacing: -.03em;
  }
  .empty-hint p { margin: 0 auto; max-width: 420px; font-size: 15px; line-height: 1.5; }

  .msg { max-width: 100%; animation: fade .18s ease; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  .msg.user {
    align-self: flex-end;
    max-width: min(640px, 92%);
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 12px 16px;
    white-space: pre-wrap;
    line-height: 1.5; font-size: 15px;
  }
  .msg.assistant {
    align-self: stretch;
    padding: 2px 4px 4px;
  }
  .msg.assistant .meta {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px; color: var(--dim); font-size: 13px; font-weight: 560;
  }
  .msg.assistant .meta .avatar {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--btn); color: var(--btn-fg);
    display: grid; place-items: center; font-size: 12px; font-weight: 800;
  }
  .msg.assistant.streaming .md::after {
    content: "▍"; margin-left: 2px; color: var(--dim);
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .md { font-size: 15.5px; line-height: 1.65; word-wrap: break-word; overflow-wrap: anywhere; color: var(--fg-2); }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: .55em 0; }
  .md h1, .md h2, .md h3, .md h4 {
    margin: 1.1em 0 .4em; line-height: 1.25; font-weight: 650; color: var(--fg);
    letter-spacing: -.02em;
  }
  .md h1 { font-size: 1.4em; }
  .md h2 { font-size: 1.2em; }
  .md h3 { font-size: 1.05em; }
  .md ul, .md ol { margin: .5em 0; padding-left: 1.4em; }
  .md li { margin: .25em 0; }
  .md li::marker { color: var(--muted); }
  .md blockquote {
    margin: .7em 0; padding: .2em 0 .2em 14px;
    border-left: 2px solid var(--line-2); color: var(--dim);
  }
  .md a { color: var(--blue); text-decoration: none; }
  .md a:hover { text-decoration: underline; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 1.1em 0; }
  .md code {
    font-family: var(--mono); font-size: .88em;
    background: var(--code-bg); padding: .12em .4em; border-radius: 6px; color: var(--fg);
  }
  .md pre {
    margin: .8em 0; padding: 14px 16px;
    background: var(--pre-bg); border: 1px solid var(--line);
    border-radius: 14px; overflow-x: auto;
  }
  .md pre code { background: none; padding: 0; font-size: 13px; line-height: 1.5; }
  .md table { border-collapse: collapse; width: 100%; margin: .8em 0; font-size: 14px; }
  .md th, .md td { border: 1px solid var(--line); padding: 8px 10px; }
  .md th { background: var(--bg-3); color: var(--dim); }

  .tool {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 12px; color: var(--dim);
    background: var(--bg-3); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px;
  }
  .tool::before { content: "•"; color: var(--blue); }
  .tool.fail { color: var(--err); border-color: rgba(244,33,46,.35); }
  .tool.fail::before { content: "×"; color: var(--err); }
  .tool .name { color: var(--fg-2); font-weight: 600; }

  /* Composer — Grok-style floating bar */
  #composer-wrap {
    flex-shrink: 0;
    padding: 8px 16px 18px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 0%, transparent), var(--bg) 28%);
  }
  #composer {
    max-width: 760px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--bg-3);
    border: 1px solid var(--line-2);
    border-radius: var(--radius);
    padding: 10px 10px 10px 16px;
    box-shadow: var(--shadow);
  }
  #composer:focus-within {
    border-color: var(--muted);
  }
  #composer textarea {
    flex: 1; margin: 0; resize: none;
    min-height: 28px; max-height: 180px;
    background: transparent; border: 0; outline: none;
    padding: 8px 4px; line-height: 1.45; font-size: 15.5px;
  }
  #composer textarea::placeholder { color: var(--muted); }
  #send {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--btn); color: var(--btn-fg);
    display: grid; place-items: center; flex-shrink: 0;
    font-size: 18px; font-weight: 700;
  }
  #send:hover:not(:disabled) { background: var(--btn-hover); }
  #send:disabled { background: var(--btn-disabled-bg); color: var(--btn-disabled-fg); }
  .foot {
    max-width: 760px; margin: 10px auto 0;
    text-align: center; color: var(--muted); font-size: 11px;
  }

  /* Modals: provider / plugins */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 40;
    background: var(--modal-scrim);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal {
    width: min(520px, 100%);
    max-height: min(80vh, 720px);
    overflow: auto;
    background: var(--bg-3);
    border: 1px solid var(--line-2);
    border-radius: 18px;
    padding: 20px 20px 16px;
    box-shadow: var(--shadow);
  }
  .modal h3 {
    margin: 0 0 14px; font-size: 1.05rem; font-weight: 650; letter-spacing: -.02em;
  }
  .modal .field { margin-bottom: 10px; }
  .modal label {
    display: block; font-size: 11px; color: var(--muted);
    margin-bottom: 4px; text-transform: uppercase; letter-spacing: .06em;
  }
  .modal input {
    width: 100%; padding: 11px 12px;
    background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; outline: none;
  }
  .modal input:focus { border-color: var(--muted); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .modal-actions button {
    padding: 10px 16px; border-radius: 999px; font-weight: 600;
  }
  .plugin-card {
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px; margin: 0 0 10px;
  }
  .plugin-card .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: rgba(0,186,124,.12); color: var(--ok);
  }
  .badge.off { background: var(--bg-hover); color: var(--dim); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }


  #theme-toggle {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center; color: var(--dim);
    border: 1px solid var(--line);
    font-size: 15px;
  }
  #theme-toggle:hover { background: var(--bg-hover); color: var(--fg); }
  .sb-item#theme-toggle-sb { /* sidebar theme control uses sb-item */ }

  @media (max-width: 800px) {
    #sidebar {
      position: fixed; z-index: 30; height: 100%;
      box-shadow: 8px 0 40px rgba(0,0,0,.5);
    }
    #sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-w)); }
  }
</style>
</head>
<body>

<div id="auth">
  <div class="auth-card">
    <div class="logo">A</div>
    <h1>Ariadne</h1>
    <p class="tag">个人开源 Agent 内核 · 像 Grok 一样对话，在你的项目上动手</p>
    <input id="u" placeholder="用户名" autocomplete="username">
    <input id="p" type="password" placeholder="密码（≥8 位）" autocomplete="current-password">
    <div class="auth-actions">
      <button type="button" id="login" class="btn-primary">登录</button>
      <button type="button" id="register" class="btn-secondary">注册</button>
    </div>
    <p class="warn" id="authmsg"></p>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="sb-top">
      <div class="sb-brand"><span class="mark">A</span> Ariadne</div>
      <button type="button" id="session-new"><span class="plus">+</span> 新对话</button>
    </div>
    <div class="sb-section">历史</div>
    <div id="sess-list"><div class="sb-empty">登录后加载会话…</div></div>
    <div class="sb-bottom">
      <button type="button" class="sb-item" id="theme-toggle-sb">
        <span class="ico" id="theme-ico-sb">☀</span>
        <span>
          <span>外观</span>
          <span class="sub" id="theme-label-sb">深色</span>
        </span>
      </button>
      <button type="button" class="sb-item" id="editprovider">
        <span class="ico">⚙</span>
        <span>
          <span id="provider-label">Provider</span>
          <span class="sub" id="provider">未配置</span>
        </span>
      </button>
      <button type="button" class="sb-item" id="editplugins">
        <span class="ico">▣</span>
        <span>插件</span>
      </button>
      <button type="button" class="sb-item" id="logout">
        <span class="ico">⎋</span>
        <span>
          <span id="who">—</span>
          <span class="sub">退出登录</span>
        </span>
      </button>
    </div>
  </aside>

  <div id="main">
    <div class="topbar">
      <button type="button" id="sidebar-toggle" title="侧栏">☰</button>
      <span class="title">Ariadne</span>
      <div class="spacer"></div>
      <button type="button" id="theme-toggle" title="切换浅色/深色主题" aria-label="切换主题">☀</button>
      <span id="session-chip" title="当前 session"><span id="session-label">—</span></span>
      <span id="provider-chip" class="off"><span class="dot"></span><span id="provider-status">未配置</span></span>
    </div>

    <div id="chat">
      <div class="chat-inner has-empty" id="chat-inner">
        <div class="empty-hint" id="empty-hint">
          <div class="thread-art">A</div>
          <h2>今天想做什么？</h2>
          <p>在左侧管理会话；下方输入任务。支持 Markdown 流式回复与工具调用。</p>
        </div>
      </div>
    </div>

    <div id="composer-wrap">
      <div id="composer">
        <textarea id="input" rows="1" placeholder="给 Ariadne 下达任务…"></textarea>
        <button type="button" id="send" title="发送" aria-label="发送">↑</button>
      </div>
      <div class="foot">Ariadne 可能出错，请核对重要信息 · open-source agent kernel</div>
    </div>
  </div>

  <!-- Provider modal (keep #settings for e2e) -->
  <div id="settings" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-label="Provider">
      <h3>Provider（BYOK）</h3>
      <div class="field">
        <label for="baseurl">BASE_URL</label>
        <input id="baseurl" placeholder="https://api.example.com/v1">
      </div>
      <div class="field">
        <label for="apikey">API_KEY</label>
        <input id="apikey" type="password" placeholder="Bearer token" autocomplete="off">
      </div>
      <div class="field">
        <label for="model">MODEL</label>
        <input id="model" placeholder="LongCat-2.0">
      </div>
      <p class="warn" id="provmsg"></p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="settings-close">取消</button>
        <button type="button" class="btn-primary" id="saveprovider">保存</button>
      </div>
    </div>
  </div>

  <!-- Plugins modal -->
  <div id="plugins" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-label="插件" style="width:min(560px,100%)">
      <h3>官方插件</h3>
      <div id="plugins-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="plugins-close">关闭</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ── Minimal Markdown ── */
const MD = (() => {
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function inline(src) {
    let s = esc(src);
    s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    s = s.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>');
    s = s.replace(/(?<!_)_([^_\n]+)_(?!_)/g, '<em>$1</em>');
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g,
      '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return s;
  }
  function render(md) {
    if (!md) return '';
    const text = String(md).replace(/\r\n?/g, '\n');
    const lines = text.split('\n');
    const out = [];
    let i = 0, inCode = false, codeLang = '', codeBuf = [], listType = null, para = [];
    const flushPara = () => {
      if (!para.length) return;
      out.push('<p>' + inline(para.join(' ')) + '</p>');
      para = [];
    };
    const flushList = () => {
      if (!listType) return;
      out.push(listType === 'ul' ? '</ul>' : '</ol>');
      listType = null;
    };
    const flushCode = () => {
      out.push('<pre><code class="language-' + esc(codeLang) + '">' +
        esc(codeBuf.join('\n')) + '</code></pre>');
      codeBuf = []; codeLang = ''; inCode = false;
    };
    while (i < lines.length) {
      const line = lines[i];
      const fence = line.match(/^```([\w-]*)\s*$/);
      if (fence) {
        flushPara(); flushList();
        if (inCode) flushCode();
        else { inCode = true; codeLang = fence[1] || ''; codeBuf = []; }
        i++; continue;
      }
      if (inCode) { codeBuf.push(line); i++; continue; }
      if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
        flushPara(); flushList(); out.push('<hr>'); i++; continue;
      }
      const hm = line.match(/^(#{1,4})\s+(.+)$/);
      if (hm) {
        flushPara(); flushList();
        const n = hm[1].length;
        out.push('<h' + n + '>' + inline(hm[2].trim()) + '</h' + n + '>');
        i++; continue;
      }
      if (/^>\s?/.test(line)) {
        flushPara(); flushList();
        const parts = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          parts.push(lines[i].replace(/^>\s?/, '')); i++;
        }
        out.push('<blockquote><p>' + inline(parts.join(' ')) + '</p></blockquote>');
        continue;
      }
      if (/^\s*[-*+]\s+/.test(line)) {
        flushPara();
        if (listType !== 'ul') { flushList(); out.push('<ul>'); listType = 'ul'; }
        out.push('<li>' + inline(line.replace(/^\s*[-*+]\s+/, '')) + '</li>');
        i++; continue;
      }
      if (/^\s*\d+\.\s+/.test(line)) {
        flushPara();
        if (listType !== 'ol') { flushList(); out.push('<ol>'); listType = 'ol'; }
        out.push('<li>' + inline(line.replace(/^\s*\d+\.\s+/, '')) + '</li>');
        i++; continue;
      }
      if (/^\s*$/.test(line)) { flushPara(); flushList(); i++; continue; }
      flushList();
      para.push(line.trim());
      i++;
    }
    if (inCode) flushCode();
    flushPara(); flushList();
    return out.join('\n');
  }
  return { render, esc };
})();

const $ = id => document.getElementById(id);

function preferredTheme() {
  const saved = localStorage.getItem('ariadne_theme');
  if (saved === 'light' || saved === 'dark') return saved;
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
  return 'dark';
}
function applyTheme(theme) {
  const t = theme === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('ariadne_theme', t);
  const isLight = t === 'light';
  const icon = isLight ? '☾' : '☀';
  const label = isLight ? '浅色' : '深色';
  const tip = isLight ? '切换到深色主题' : '切换到浅色主题';
  const btn = document.getElementById('theme-toggle');
  if (btn) { btn.textContent = icon; btn.title = tip; btn.setAttribute('aria-label', tip); }
  const ico = document.getElementById('theme-ico-sb');
  if (ico) ico.textContent = icon;
  const lab = document.getElementById('theme-label-sb');
  if (lab) lab.textContent = label + '（点击切换）';
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || preferredTheme();
  applyTheme(cur === 'light' ? 'dark' : 'light');
}
applyTheme(preferredTheme());

let token = localStorage.getItem('ariadne_token') || '';
let sessionId = localStorage.getItem('ariadne_session') || '';
let busy = false;
let username = '';
let sidebarCollapsed = localStorage.getItem('ariadne_sidebar') === '0';

function authHeaders() {
  return { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
}

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (r.status === 401) { logout(); throw new Error('unauthorized'); }
  return r;
}

function applySidebar() {
  $('sidebar').classList.toggle('collapsed', sidebarCollapsed);
  localStorage.setItem('ariadne_sidebar', sidebarCollapsed ? '0' : '1');
}

function setSessionId(id, { persist = true } = {}) {
  sessionId = id;
  if (persist) localStorage.setItem('ariadne_session', id);
  const short = id.length > 20 ? id.slice(0, 10) + '…' + id.slice(-4) : id;
  $('session-label').textContent = short;
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  if (Number.isNaN(d.getTime())) return '';
  const pad = n => String(n).padStart(2, '0');
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function clearChat() {
  const inner = $('chat-inner');
  inner.classList.add('has-empty');
  inner.innerHTML =
    '<div class="empty-hint" id="empty-hint">' +
    '<div class="thread-art">A</div>' +
    '<h2>今天想做什么？</h2>' +
    '<p>在左侧新建或切换会话，在下方输入任务。支持 Markdown 流式回复。</p></div>';
}

function renderHistory(messages) {
  const inner = $('chat-inner');
  inner.innerHTML = '';
  inner.classList.remove('has-empty');
  if (!messages || !messages.length) {
    clearChat();
    return;
  }
  for (const m of messages) {
    if (m.role === 'user') addUserMsg(m.content || '');
    else if (m.role === 'assistant') {
      const shell = addAssistantShell();
      setAssistantMarkdown(shell, m.content || '', { streaming: false });
    }
  }
  scrollChat();
}

async function loadSessionHistory(id) {
  const r = await api('/api/sessions/' + encodeURIComponent(id), { headers: authHeaders() });
  if (!r.ok) { clearChat(); return; }
  renderHistory((await r.json()).messages || []);
}

async function loadSessions() {
  const root = $('sess-list');
  root.innerHTML = '<div class="sb-empty">加载中…</div>';
  try {
    const list = await (await api('/api/sessions', { headers: authHeaders() })).json();
    root.innerHTML = '';
    if (!list.length) {
      root.innerHTML = '<div class="sb-empty">还没有历史。发一条消息后会出现在这里。</div>';
      return;
    }
    for (const s of list) {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'sess-row' + (s.session_id === sessionId ? ' active' : '');
      row.dataset.sid = s.session_id;
      const body = document.createElement('div');
      body.className = 'body';
      body.innerHTML =
        '<div class="preview">' + MD.esc(s.preview || s.session_id) + '</div>' +
        '<div class="meta">' + (s.turns || 0) + ' 轮 · ' + MD.esc(fmtTime(s.mtime)) + '</div>';
      const del = document.createElement('span');
      del.className = 'del';
      del.textContent = '删';
      del.onclick = async (ev) => {
        ev.stopPropagation();
        if (!confirm('删除此会话？不可恢复。')) return;
        const r = await api('/api/sessions/' + encodeURIComponent(s.session_id), {
          method: 'DELETE', headers: authHeaders(),
        });
        if (!r.ok) return;
        if (s.session_id === sessionId) await createNewSession({ load: true });
        else loadSessions();
      };
      row.onclick = async () => {
        if (s.session_id === sessionId) return;
        setSessionId(s.session_id);
        await loadSessionHistory(s.session_id);
        loadSessions();
        if (window.innerWidth <= 800) {
          sidebarCollapsed = true;
          applySidebar();
        }
      };
      row.appendChild(body);
      row.appendChild(del);
      root.appendChild(row);
    }
  } catch (e) {
    root.innerHTML = '<div class="sb-empty">加载失败</div>';
  }
}

async function createNewSession({ load = true } = {}) {
  const r = await api('/api/sessions', { method: 'POST', headers: authHeaders() });
  if (!r.ok) return;
  setSessionId((await r.json()).session_id);
  if (load) clearChat();
  loadSessions();
  $('input').focus();
}

async function doAuth(path) {
  const body = JSON.stringify({ username: $('u').value.trim(), password: $('p').value });
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
  if (!r.ok) {
    let detail = 'failed';
    try { detail = (await r.json()).detail || detail; } catch (_) {}
    $('authmsg').textContent = detail;
    return;
  }
  token = (await r.json()).token;
  localStorage.setItem('ariadne_token', token);
  enter();
}
$('login').onclick = () => doAuth('/api/auth/login');
$('register').onclick = () => doAuth('/api/auth/register');

function logout() {
  token = '';
  username = '';
  localStorage.removeItem('ariadne_token');
  $('app').classList.add('hidden');
  $('auth').classList.remove('hidden');
}
$('logout').onclick = logout;

function openModal(id) { $(id).classList.remove('hidden'); }
function closeModal(id) { $(id).classList.add('hidden'); }

async function enter() {
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  applySidebar();
  const me = await (await api('/api/me', { headers: authHeaders() })).json();
  username = me.username;
  $('who').textContent = username;
  if (!sessionId) {
    const r = await api('/api/sessions', { method: 'POST', headers: authHeaders() });
    if (r.ok) setSessionId((await r.json()).session_id);
    else setSessionId('web-' + Math.random().toString(16).slice(2, 8));
  } else {
    setSessionId(sessionId);
  }
  const chip = $('provider-chip');
  if (me.provider_configured) {
    const label = me.model + ' · ' + (me.base_url || '').replace(/^https?:\/\//, '');
    $('provider').textContent = label;
    $('provider-status').textContent = me.model || 'ready';
    chip.classList.remove('off');
  } else {
    $('provider').textContent = '未配置 provider';
    $('provider-status').textContent = '未配置';
    chip.classList.add('off');
    openModal('settings');
  }
  await loadSessionHistory(sessionId);
  loadSessions();
  $('input').focus();
}

$('theme-toggle').onclick = toggleTheme;
$('theme-toggle-sb').onclick = toggleTheme;
$('sidebar-toggle').onclick = () => {
  sidebarCollapsed = !sidebarCollapsed;
  applySidebar();
};
$('session-new').onclick = () => createNewSession({ load: true });
$('editprovider').onclick = () => openModal('settings');
$('editplugins').onclick = () => { openModal('plugins'); loadPlugins(); };
$('settings-close').onclick = () => closeModal('settings');
$('plugins-close').onclick = () => closeModal('plugins');
$('settings').addEventListener('click', e => { if (e.target === $('settings')) closeModal('settings'); });
$('plugins').addEventListener('click', e => { if (e.target === $('plugins')) closeModal('plugins'); });

async function loadPlugins() {
  const list = await (await api('/api/me/plugins', { headers: authHeaders() })).json();
  const root = $('plugins-body');
  root.innerHTML = '';
  for (const p of list) {
    const card = document.createElement('div');
    card.className = 'plugin-card';
    const head = document.createElement('div');
    head.className = 'head';
    head.innerHTML =
      '<strong>' + MD.esc(p.name) + '</strong>' +
      '<small style="color:var(--dim)">' + MD.esc(p.description) + '</small>' +
      (p.enabled
        ? '<span class="badge">已启用</span>'
        : '<span class="badge off">未启用</span>');
    card.appendChild(head);
    const inputs = {};
    const cfg = p.config || {};
    for (const key of p.required_config) {
      const wrap = document.createElement('div');
      wrap.className = 'field';
      wrap.style.marginTop = '8px';
      const lab = document.createElement('label');
      lab.textContent = key;
      const inp = document.createElement('input');
      const secret = /key|token|password|secret/i.test(key);
      const shown = cfg[key] || '';
      if (secret && shown) {
        inp.type = 'text';
        inp.value = shown;
        inp.spellcheck = false;
        inp.autocomplete = 'off';
        inp.style.fontFamily = 'var(--mono)';
        inp.title = '已脱敏；保持 ***** 可保留原密钥';
      } else if (secret) {
        inp.type = 'password';
        inp.placeholder = key;
        inp.autocomplete = 'new-password';
      } else {
        inp.type = 'text';
        inp.placeholder = key;
        if (shown) inp.value = shown;
      }
      wrap.appendChild(lab);
      wrap.appendChild(inp);
      card.appendChild(wrap);
      inputs[key] = inp;
    }
    const row = document.createElement('div');
    row.className = 'row';
    row.style.marginTop = '10px';
    const enableBtn = document.createElement('button');
    enableBtn.type = 'button';
    enableBtn.className = 'btn-primary';
    enableBtn.style.padding = '10px';
    enableBtn.textContent = p.enabled ? '更新' : '启用';
    enableBtn.onclick = async () => {
      const config = {};
      for (const k of p.required_config) config[k] = inputs[k].value;
      const r = await api('/api/me/plugins/' + p.name, {
        method: 'PUT', headers: authHeaders(), body: JSON.stringify({ config }),
      });
      if (!r.ok) alert((await r.json()).detail);
      loadPlugins();
    };
    row.appendChild(enableBtn);
    if (p.enabled) {
      const disableBtn = document.createElement('button');
      disableBtn.type = 'button';
      disableBtn.className = 'btn-secondary';
      disableBtn.style.padding = '10px';
      disableBtn.textContent = '停用';
      disableBtn.onclick = async () => {
        await api('/api/me/plugins/' + p.name, { method: 'DELETE', headers: authHeaders() });
        loadPlugins();
      };
      row.appendChild(disableBtn);
    }
    card.appendChild(row);
    root.appendChild(card);
  }
}

$('saveprovider').onclick = async () => {
  const r = await api('/api/me/provider', {
    method: 'PUT', headers: authHeaders(),
    body: JSON.stringify({
      base_url: $('baseurl').value,
      api_key: $('apikey').value,
      model: $('model').value,
    }),
  });
  $('provmsg').textContent = r.ok ? '已保存' : ((await r.json()).detail || 'failed');
  if (r.ok) { closeModal('settings'); enter(); }
};

function hideEmpty() {
  const h = $('empty-hint');
  if (h) h.remove();
  $('chat-inner').classList.remove('has-empty');
}

function scrollChat() {
  const el = $('chat');
  el.scrollTop = el.scrollHeight;
}

function addUserMsg(text) {
  hideEmpty();
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  $('chat-inner').appendChild(div);
  scrollChat();
  return div;
}

function addAssistantShell() {
  hideEmpty();
  const div = document.createElement('div');
  div.className = 'msg assistant streaming';
  div.innerHTML =
    '<div class="meta"><span class="avatar">A</span><span>Ariadne</span><span class="status">· 思考中</span></div>' +
    '<div class="md">…</div>';
  $('chat-inner').appendChild(div);
  scrollChat();
  return div;
}

function setAssistantMarkdown(shell, text, { streaming = true } = {}) {
  const md = shell.querySelector('.md');
  const meta = shell.querySelector('.meta .status');
  if (streaming) {
    shell.classList.add('streaming');
    if (meta) meta.textContent = '· 思考中';
  } else {
    shell.classList.remove('streaming');
    if (meta) meta.textContent = '';
  }
  shell.dataset.raw = text || '';
  md.innerHTML = text ? MD.render(text) : (streaming ? '…' : '<p>(empty reply)</p>');
  scrollChat();
}

function addTool(name, status, detail) {
  hideEmpty();
  const div = document.createElement('div');
  div.className = 'tool' + (status === 'failed' ? ' fail' : '');
  div.innerHTML =
    '<span class="name">' + MD.esc(name) + '</span>' +
    (detail ? '<span>' + MD.esc(detail) + '</span>' : '');
  $('chat-inner').appendChild(div);
  scrollChat();
}

function createStreamRenderer(shell) {
  let full = '';
  let pending = null;
  let lastPaint = 0;
  const paint = (force = false) => {
    const now = performance.now();
    if (!force && now - lastPaint < 40) {
      if (pending == null) {
        pending = requestAnimationFrame(() => {
          pending = null;
          lastPaint = performance.now();
          setAssistantMarkdown(shell, full, { streaming: true });
        });
      }
      return;
    }
    if (pending != null) { cancelAnimationFrame(pending); pending = null; }
    lastPaint = now;
    setAssistantMarkdown(shell, full, { streaming: true });
  };
  return {
    append(chunk) { full += chunk; paint(false); },
    set(text) { full = text || ''; paint(true); },
    finish(fallbackText) {
      if (!full && fallbackText) full = fallbackText;
      if (pending != null) { cancelAnimationFrame(pending); pending = null; }
      setAssistantMarkdown(shell, full || '(empty reply)', { streaming: false });
      return full;
    },
    get text() { return full; },
  };
}

async function send() {
  if (busy) return;
  const text = $('input').value.trim();
  if (!text) return;
  $('input').value = '';
  autoSizeInput();
  busy = true;
  $('send').disabled = true;

  addUserMsg(text);
  const shell = addAssistantShell();
  const stream = createStreamRenderer(shell);

  try {
    const url =
      '/api/turns/stream?input=' + encodeURIComponent(text) +
      '&session_id=' + encodeURIComponent(sessionId);
    const r = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) {
      let detail = '';
      try { detail = (await r.json()).detail || ''; } catch (_) {}
      stream.set('ERROR ' + r.status + (detail ? ': ' + detail : ''));
      stream.finish();
      return;
    }
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        let ev;
        try { ev = JSON.parse(line.replace(/^data:\s?/, '')); } catch (_) { continue; }
        if (ev.kind === 'model_delta') {
          stream.append(String((ev.data && ev.data.text) || ''));
        } else if (ev.kind === 'tool_started') {
          addTool(ev.data.name, 'started');
        } else if (ev.kind === 'tool_completed') {
          addTool(ev.data.name, ev.data.status, (ev.data.error && ev.data.error.code) || '');
        } else if (ev.kind === 'guard_finding') {
          addTool('guard:' + ev.data.direction, 'failed', ev.data.detail);
        } else if (ev.kind === 'turn_completed' || ev.kind === 'turn_failed') {
          const res = ev.result;
          if (res) {
            if (!stream.text && res.text) stream.set(res.text);
            stream.finish(res.text || '');
            if (res.status !== 'completed') {
              addTool('turn', 'failed', (res.error && res.error.code) || 'failed');
            }
          } else stream.finish();
        }
      }
    }
    stream.finish();
    loadSessions();
  } catch (err) {
    stream.set('ERROR: ' + (err && err.message ? err.message : String(err)));
    stream.finish();
  } finally {
    busy = false;
    $('send').disabled = false;
    $('input').focus();
  }
}

function autoSizeInput() {
  const el = $('input');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}

$('send').onclick = send;
$('input').addEventListener('input', autoSizeInput);
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

if (token) enter().catch(() => logout());
</script>
</body>
</html>
