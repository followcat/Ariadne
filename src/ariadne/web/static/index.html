<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ariadne</title>
<script>
(function () {
  try {
    var t = localStorage.getItem('ariadne_theme');
    if (t !== 'light' && t !== 'dark') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
<style>
  :root, [data-theme="dark"] {
    --bg: #000000;
    --bg-2: #0a0a0a;
    --bg-3: #111111;
    --bg-hover: #1a1a1a;
    --fg: #f5f5f5;
    --fg-2: #e5e5e5;
    --dim: #8a8a8a;
    --muted: #5c5c5c;
    --line: #222;
    --line-2: #2a2a2a;
    --btn: #ffffff;
    --btn-fg: #000000;
    --btn-hover: #e8e8e8;
    --btn-disabled-bg: #333333;
    --btn-disabled-fg: #777777;
    --code-bg: #1a1a1a;
    --pre-bg: #0d0d0d;
    --scroll: #2a2a2a;
    --shadow: 0 12px 40px rgba(0,0,0,.45);
    --modal-scrim: rgba(0,0,0,.55);
    --blue: #1d9bf0;
    --ok: #00ba7c;
    --warn: #ffad1f;
    --err: #f4212e;
    --gold: #c9a227;
    --radius: 24px;
    --sidebar-w: 280px;
    --tools-w: 340px;
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #f7f7f8;
    --bg-2: #ffffff;
    --bg-3: #ffffff;
    --bg-hover: #eef0f3;
    --fg: #0f1419;
    --fg-2: #1a1a1a;
    --dim: #536471;
    --muted: #8b98a5;
    --line: #e5e7eb;
    --line-2: #d0d5dd;
    --btn: #0f1419;
    --btn-fg: #ffffff;
    --btn-hover: #2a2a2a;
    --btn-disabled-bg: #d0d5dd;
    --btn-disabled-fg: #6b7280;
    --code-bg: #eef0f3;
    --pre-bg: #f0f2f5;
    --scroll: #c5cad3;
    --shadow: 0 12px 40px rgba(15,20,25,.08);
    --modal-scrim: rgba(15,20,25,.35);
    --blue: #1d9bf0;
    --ok: #00a06a;
    --warn: #b58105;
    --err: #cf1f2b;
    --gold: #a07d12;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    transition: background .2s ease, color .2s ease;
  }
  .hidden { display: none !important; }
  button, input, textarea { font: inherit; color: inherit; }
  button {
    border: 0; cursor: pointer; background: transparent;
    transition: background .12s, opacity .12s, transform .08s;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:active:not(:disabled) { transform: scale(.98); }

  /* ── Auth (centered card) ── */
  #auth {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background:
      radial-gradient(800px 400px at 50% -10%, rgba(255,255,255,.06), transparent 60%),
      var(--bg);
  }
  .auth-card {
    width: min(400px, 100%);
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 28px 28px;
  }
  .auth-card .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--btn); color: var(--btn-fg);
    display: grid; place-items: center;
    font-weight: 800; font-size: 20px; margin-bottom: 18px;
  }
  .auth-card h1 { margin: 0 0 6px; font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
  .auth-card .tag { color: var(--dim); font-size: 14px; margin: 0 0 24px; line-height: 1.45; }
  .auth-card input {
    width: 100%; padding: 12px 14px; margin: 0 0 10px;
    background: var(--bg); border: 1px solid var(--line-2); border-radius: 12px; outline: none;
  }
  .auth-card input:focus { border-color: var(--muted); }
  .auth-actions { display: flex; gap: 10px; margin-top: 8px; }
  .auth-actions button { flex: 1; padding: 12px; border-radius: 999px; font-weight: 600; }
  .btn-primary { background: var(--btn); color: var(--btn-fg); }
  .btn-primary:hover { background: var(--btn-hover); }
  .btn-secondary { background: transparent; border: 1px solid var(--line-2) !important; color: var(--fg); }
  .btn-secondary:hover { background: var(--bg-hover); }
  .warn { color: var(--warn); font-size: 13px; min-height: 1.2em; margin: 12px 0 0; }

  /* ── App: sidebar + main (Grok-like) ── */
  #app {
    display: flex; height: 100vh; height: 100dvh; overflow: hidden;
  }
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--bg-2);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    transition: margin .2s ease, opacity .2s;
  }
  #sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-w)); opacity: 0; pointer-events: none; }
  .sb-top {
    padding: 14px 12px 8px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .sb-brand {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px; font-weight: 700; letter-spacing: -.02em;
  }
  .sb-brand .mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--btn); color: var(--btn-fg); display: grid; place-items: center;
    font-size: 14px; font-weight: 800;
  }
  #session-new {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--line-2); color: var(--fg); font-weight: 560;
  }
  #session-new:hover { background: var(--bg-hover); }
  #session-new .plus {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--btn); color: var(--btn-fg);
    display: grid; place-items: center; font-size: 16px; line-height: 1; font-weight: 600;
  }
  .sb-section {
    padding: 8px 12px 4px;
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em; font-weight: 600;
  }
  #sess-list {
    flex: 1; overflow-y: auto; padding: 4px 8px 12px;
  }
  #sess-list::-webkit-scrollbar { width: 6px; }
  #sess-list::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  .sess-row {
    width: 100%; text-align: left;
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 10px; border-radius: 12px;
    margin-bottom: 2px; color: var(--fg-2);
  }
  .sess-row:hover { background: var(--bg-hover); }
  .sess-row.active { background: var(--bg-3); }
  .sess-row .body { flex: 1; min-width: 0; }

  .sess-row .title-line {
    font-size: 13.5px; font-weight: 600; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sess-row .title-line .src {
    font-weight: 400; color: var(--muted); font-size: 11px; margin-left: 4px;
  }
  .topbar .title {
    cursor: pointer; max-width: min(40vw, 280px);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .topbar .title:hover { text-decoration: underline; text-underline-offset: 3px; }

  .sess-row .preview {
    font-size: 13.5px; line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sess-row .meta {
    font-size: 11px; color: var(--muted); margin-top: 3px;
  }
  .sess-row .del {
    opacity: 0; padding: 4px 8px; border-radius: 8px;
    color: var(--dim); font-size: 12px; flex-shrink: 0;
  }
  .sess-row:hover .del { opacity: 1; }
  .sess-row .del:hover { background: rgba(244,33,46,.15); color: var(--err); }
  .sb-empty { padding: 16px 12px; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .sb-bottom {
    border-top: 1px solid var(--line);
    padding: 10px 8px 12px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .sb-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 10px 10px; border-radius: 12px;
    color: var(--fg-2); font-size: 13.5px; text-align: left;
  }
  .sb-item:hover { background: var(--bg-hover); }
  .sb-item .ico {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--bg-3); border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 13px; color: var(--dim);
  }
  .sb-item .sub { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
  #who { font-weight: 560; }
  #provider { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Main column */
  #main {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    background: var(--bg);
    position: relative;
  }
  .topbar {
    height: 52px; flex-shrink: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 0 16px;
  }
  #sidebar-toggle {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center; color: var(--dim);
  }
  #sidebar-toggle:hover { background: var(--bg-hover); color: var(--fg); }
  .topbar .title {
    font-weight: 600; font-size: 15px; letter-spacing: -.01em;
  }
  .topbar .spacer { flex: 1; }
  #tools-toggle:hover { background: var(--bg-hover); color: var(--fg); }
  #session-chip {
    font-size: 12px; color: var(--muted); font-family: var(--mono);
    padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line);
  }
  #provider-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 6px 10px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ok);
  }
  #provider-chip.off { color: var(--warn); }
  #provider-chip .dot {
    width: 6px; height: 6px; border-radius: 50%; background: currentColor;
  }

  /* Chat */
  #chat {
    flex: 1; overflow-y: auto;
    scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }
  .chat-inner {
    max-width: 760px; margin: 0 auto;
    padding: 12px 20px 8px;
    min-height: 100%;
    display: flex; flex-direction: column; gap: 22px;
  }
  .chat-inner.has-empty {
    justify-content: center; min-height: calc(100% - 8px);
  }

  .empty-hint {
    text-align: center; padding: 24px 12px 8px; color: var(--dim);
  }
  .empty-hint .thread-art {
    width: 56px; height: 56px; margin: 0 auto 18px;
    border-radius: 16px; background: var(--btn); color: var(--btn-fg);
    display: grid; place-items: center; font-size: 26px; font-weight: 800;
  }
  .empty-hint h2 {
    margin: 0 0 10px; font-size: 1.75rem; font-weight: 650;
    color: var(--fg); letter-spacing: -.03em;
  }
  .empty-hint p { margin: 0 auto; max-width: 420px; font-size: 15px; line-height: 1.5; }

  .msg { max-width: 100%; animation: fade .18s ease; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  .msg.user {
    align-self: flex-end;
    max-width: min(640px, 92%);
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 12px 16px;
    white-space: pre-wrap;
    line-height: 1.5; font-size: 15px;
  }
  .msg.assistant {
    align-self: stretch;
    padding: 2px 4px 4px;
  }
  .msg.assistant .meta {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px; color: var(--dim); font-size: 13px; font-weight: 560;
  }
  .msg.assistant .meta .avatar {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--btn); color: var(--btn-fg);
    display: grid; place-items: center; font-size: 12px; font-weight: 800;
  }
  .msg.assistant.streaming .md.has-text::after {
    content: "▋"; margin-left: 2px; color: var(--dim);
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Thinking / reasoning: live open, collapse when answer ready (ChatGPT·Grok) */
  .thinking {
    margin: 0 0 10px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg-3);
    overflow: hidden;
  }
  .thinking.hidden { display: none; }
  .thinking-toggle {
    width: 100%; text-align: left;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    font-size: 13px; color: var(--dim); font-weight: 560;
  }
  .thinking-toggle:hover { background: var(--bg-hover); color: var(--fg-2); }
  .thinking-toggle .ico {
    width: 18px; height: 18px; border-radius: 6px;
    display: grid; place-items: center; font-size: 11px;
    background: var(--bg-hover); color: var(--muted);
  }
  .thinking.live .thinking-toggle .ico { color: var(--blue); }
  .thinking-toggle .label { flex: 1; }
  .thinking-toggle .chev {
    font-size: 12px; color: var(--muted);
    transition: transform .15s ease;
  }
  .thinking.open .thinking-toggle .chev { transform: rotate(90deg); }
  .thinking-body {
    display: none;
    padding: 0 12px 10px;
    max-height: 220px; overflow-y: auto;
    font-size: 13px; line-height: 1.55; color: var(--muted);
    white-space: pre-wrap; word-break: break-word;
    border-top: 1px solid transparent;
  }
  .thinking.open .thinking-body,
  .thinking.live .thinking-body {
    display: block;
    border-top-color: var(--line);
    padding-top: 8px;
  }
  .thinking.live .thinking-toggle .label::after {
    content: "";
    display: inline-block; width: 5px; height: 5px; margin-left: 8px;
    border-radius: 50%; background: var(--blue);
    animation: blink 1s step-end infinite;
    vertical-align: middle;
  }
  .md.placeholder { color: var(--muted); }

  .md { font-size: 15.5px; line-height: 1.65; word-wrap: break-word; overflow-wrap: anywhere; color: var(--fg-2); }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: .55em 0; }
  .md h1, .md h2, .md h3, .md h4 {
    margin: 1.1em 0 .4em; line-height: 1.25; font-weight: 650; color: var(--fg);
    letter-spacing: -.02em;
  }
  .md h1 { font-size: 1.4em; }
  .md h2 { font-size: 1.2em; }
  .md h3 { font-size: 1.05em; }
  .md ul, .md ol { margin: .5em 0; padding-left: 1.4em; }
  .md li { margin: .25em 0; }
  .md li::marker { color: var(--muted); }
  .md blockquote {
    margin: .7em 0; padding: .2em 0 .2em 14px;
    border-left: 2px solid var(--line-2); color: var(--dim);
  }
  .md a { color: var(--blue); text-decoration: none; }
  .md a:hover { text-decoration: underline; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 1.1em 0; }
  .md code {
    font-family: var(--mono); font-size: .88em;
    background: var(--code-bg); padding: .12em .4em; border-radius: 6px; color: var(--fg);
  }
  .md pre {
    margin: .8em 0; padding: 14px 16px;
    background: var(--pre-bg); border: 1px solid var(--line);
    border-radius: 14px; overflow-x: auto;
  }
  .md pre code { background: none; padding: 0; font-size: 13px; line-height: 1.5; }
  .md table { border-collapse: collapse; width: 100%; margin: .8em 0; font-size: 14px; }
  .md th, .md td { border: 1px solid var(--line); padding: 8px 10px; }
  .md th { background: var(--bg-3); color: var(--dim); }

  /* Inline chat only keeps a compact tools summary chip */
  .tool-inline-summary {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--dim);
    background: var(--bg-3); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px;
    cursor: pointer;
  }
  .tool-inline-summary:hover { background: var(--bg-hover); color: var(--fg); }
  .tool-inline-summary .n { color: var(--fg-2); font-weight: 600; font-family: var(--mono); }
  .tool-inline-summary.has-fail { border-color: rgba(244,33,46,.35); color: var(--err); }

  /* Right tools panel (collapsible) */
  #tools-panel {
    width: var(--tools-w); flex-shrink: 0;
    background: var(--bg-2);
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
    transition: margin .2s ease, opacity .2s, width .2s ease;
    min-width: 0;
  }
  #tools-panel.collapsed {
    width: 0; margin-right: 0; opacity: 0; pointer-events: none;
    border-left: 0; overflow: hidden;
  }
  .tp-head {
    height: 52px; flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px;
    border-bottom: 1px solid var(--line);
  }
  .tp-head h2 {
    margin: 0; flex: 1; font-size: 13px; font-weight: 650;
    letter-spacing: -.01em; color: var(--fg);
  }
  .tp-head .tp-count {
    font-size: 11px; color: var(--muted); font-family: var(--mono);
    padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line);
  }
  .tp-head button {
    width: 32px; height: 32px; border-radius: 8px;
    display: grid; place-items: center; color: var(--dim); font-size: 14px;
  }
  .tp-head button:hover { background: var(--bg-hover); color: var(--fg); }
  #tools-list {
    flex: 1; overflow-y: auto; padding: 10px 10px 16px;
  }
  #tools-list::-webkit-scrollbar { width: 6px; }
  #tools-list::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 3px; }
  .tp-empty {
    padding: 24px 12px; color: var(--muted); font-size: 13px; line-height: 1.45; text-align: center;
  }
  .tp-item {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg-3);
    margin-bottom: 8px;
    overflow: hidden;
  }
  .tp-item.fail { border-color: rgba(244,33,46,.35); }
  .tp-item.run { border-color: rgba(29,155,240,.35); }
  .tp-item-head {
    width: 100%; text-align: left;
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 12px;
    color: var(--fg-2); font-size: 13px;
  }
  .tp-item-head:hover { background: var(--bg-hover); }
  .tp-item-head .dot {
    width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0;
    background: var(--blue);
  }
  .tp-item.ok .dot { background: var(--ok); }
  .tp-item.fail .dot { background: var(--err); }
  .tp-item.run .dot { background: var(--blue); animation: blink 1s step-end infinite; }
  .tp-item-head .body { flex: 1; min-width: 0; }
  .tp-item-head .name {
    font-family: var(--mono); font-weight: 650; font-size: 12.5px;
    word-break: break-all;
  }
  .tp-item-head .status-line {
    font-size: 11px; color: var(--muted); margin-top: 3px;
  }
  .tp-item.fail .status-line { color: var(--err); }
  .tp-item-head .chev {
    color: var(--muted); font-size: 12px; margin-top: 2px; transition: transform .15s;
  }
  .tp-item.open .tp-item-head .chev { transform: rotate(90deg); }
  .tp-item-body {
    display: none;
    border-top: 1px solid var(--line);
    padding: 10px 12px 12px;
    font-size: 12px;
  }
  .tp-item.open .tp-item-body { display: block; }
  .tp-sec { margin: 0 0 10px; }
  .tp-sec:last-child { margin-bottom: 0; }
  .tp-sec-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 650; margin-bottom: 4px;
  }
  .tp-pre {
    margin: 0; padding: 8px 10px;
    background: var(--pre-bg); border: 1px solid var(--line);
    border-radius: 8px; overflow-x: auto;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.45;
    color: var(--fg-2); white-space: pre-wrap; word-break: break-word;
    max-height: 220px; overflow-y: auto;
  }
  .tp-err {
    color: var(--err);
    font-family: var(--mono); font-size: 12px; line-height: 1.4;
  }
  #tools-rail {
    display: none;
    width: 36px; flex-shrink: 0;
    border-left: 1px solid var(--line);
    background: var(--bg-2);
    align-items: flex-start; justify-content: center;
    padding-top: 10px;
  }
  #tools-rail.visible { display: flex; }
  #tools-rail button {
    width: 28px; height: 28px; border-radius: 8px;
    color: var(--dim); font-size: 14px;
  }
  #tools-rail button:hover { background: var(--bg-hover); color: var(--fg); }
  #tools-rail .badge {
    position: absolute; margin-top: 22px; margin-left: 14px;
    min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 999px; background: var(--blue); color: #fff;
    font-size: 10px; font-weight: 700; line-height: 16px; text-align: center;
  }
  #tools-rail .badge.fail { background: var(--err); }

  #attach-bar {
    max-width: 760px; margin: 0 auto 8px;

  .plugin-card {
    background: var(--bg); border: 1px solid var(--line);

  .plugin-card .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;

  .badge.off { background: var(--bg-hover); color: var(--dim); }
  .row { display: flex; gap: 8px; }

  #theme-toggle {

<script>
/* ── Minimal Markdown ── */
const MD = (() => {
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function inline(src) {
    let s = esc(src);
    s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    s = s.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>');
    s = s.replace(/(?<!_)_([^_\n]+)_(?!_)/g, '<em>$1</em>');
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g,
      '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return s;
  }
  function render(md) {
    if (!md) return '';
    const text = String(md).replace(/\r\n?/g, '\n');
    const lines = text.split('\n');
    const out = [];
    let i = 0, inCode = false, codeLang = '', codeBuf = [], listType = null, para = [];
    const flushPara = () => {
      if (!para.length) return;
      out.push('<p>' + inline(para.join(' ')) + '</p>');
      para = [];
    };
    const flushList = () => {
      if (!listType) return;
      out.push(listType === 'ul' ? '</ul>' : '</ol>');
      listType = null;
    };
    const flushCode = () => {
      out.push('<pre><code class="language-' + esc(codeLang) + '">' +
        esc(codeBuf.join('\n')) + '</code></pre>');
      codeBuf = []; codeLang = ''; inCode = false;
    };
    while (i < lines.length) {
      const line = lines[i];
      const fence = line.match(/^```([\w-]*)\s*$/);
      if (fence) {
        flushPara(); flushList();
        if (inCode) flushCode();
        else { inCode = true; codeLang = fence[1] || ''; codeBuf = []; }
        i++; continue;
      }
      if (inCode) { codeBuf.push(line); i++; continue; }
      if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
        flushPara(); flushList(); out.push('<hr>'); i++; continue;
      }
      const hm = line.match(/^(#{1,4})\s+(.+)$/);
      if (hm) {
        flushPara(); flushList();
        const n = hm[1].length;
        out.push('<h' + n + '>' + inline(hm[2].trim()) + '</h' + n + '>');
        i++; continue;
      }
      if (/^>\s?/.test(line)) {
        flushPara(); flushList();
        const parts = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          parts.push(lines[i].replace(/^>\s?/, '')); i++;
        }
        out.push('<blockquote><p>' + inline(parts.join(' ')) + '</p></blockquote>');
        continue;
      }
      if (/^\s*[-*+]\s+/.test(line)) {
        flushPara();
        if (listType !== 'ul') { flushList(); out.push('<ul>'); listType = 'ul'; }
        out.push('<li>' + inline(line.replace(/^\s*[-*+]\s+/, '')) + '</li>');
        i++; continue;
      }
      if (/^\s*\d+\.\s+/.test(line)) {
        flushPara();
        if (listType !== 'ol') { flushList(); out.push('<ol>'); listType = 'ol'; }
        out.push('<li>' + inline(line.replace(/^\s*\d+\.\s+/, '')) + '</li>');
        i++; continue;
      }
      if (/^\s*$/.test(line)) { flushPara(); flushList(); i++; continue; }
      flushList();
      para.push(line.trim());
      i++;
    }
    if (inCode) flushCode();
    flushPara(); flushList();
    return out.join('\n');
  }
  return { render, esc };
})();

const $ = id => document.getElementById(id);

function preferredTheme() {
  const saved = localStorage.getItem('ariadne_theme');
  if (saved === 'light' || saved === 'dark') return saved;
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
  return 'dark';
}
function applyTheme(theme) {
  const t = theme === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('ariadne_theme', t);
  const isLight = t === 'light';
  const icon = isLight ? '☾' : '☀';
  const label = isLight ? '浅色' : '深色';
  const tip = isLight ? '切换到深色主题' : '切换到浅色主题';
  const btn = document.getElementById('theme-toggle');
  if (btn) { btn.textContent = icon; btn.title = tip; btn.setAttribute('aria-label', tip); }
  const ico = document.getElementById('theme-ico-sb');
  if (ico) ico.textContent = icon;
  const lab = document.getElementById('theme-label-sb');
  if (lab) lab.textContent = label + '（点击切换）';
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || preferredTheme();
  applyTheme(cur === 'light' ? 'dark' : 'light');
}
applyTheme(preferredTheme());

let token = localStorage.getItem('ariadne_token') || '';
let sessionId = localStorage.getItem('ariadne_session') || '';
let busy = false;
let username = '';
/** @type {{mime:string,data_base64:string,name:string,preview:string}[]} */
let pendingImages = [];

let sidebarCollapsed = localStorage.getItem('ariadne_sidebar') === '0';
// tools panel: default open on desktop when there are tools; persist user preference
let toolsCollapsed = localStorage.getItem('ariadne_tools_panel') !== '1';
/** @type {{call_id:string,name:string,status:string,arguments?:any,output?:any,error?:any,open?:boolean,ts:number}[]} */
let toolEntries = [];
let toolsOpenIds = new Set(); // call_ids user expanded

function authHeaders() {
  return { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
}

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (r.status === 401) { logout(); throw new Error('unauthorized'); }
  return r;
}

function applySidebar() {
  $('sidebar').classList.toggle('collapsed', sidebarCollapsed);
  localStorage.setItem('ariadne_sidebar', sidebarCollapsed ? '0' : '1');
}

function applyToolsPanel() {
  const panel = $('tools-panel');
  const rail = $('tools-rail');
  if (!panel) return;
  panel.classList.toggle('collapsed', toolsCollapsed);
  if (rail) rail.classList.toggle('visible', toolsCollapsed);
  localStorage.setItem('ariadne_tools_panel', toolsCollapsed ? '0' : '1');
  updateToolsBadges();
}

function updateToolsBadges() {
  const n = toolEntries.length;
  const fails = toolEntries.filter(t => t.status === 'failed').length;
  const countEl = $('tools-count');
  if (countEl) countEl.textContent = String(n);
  const badge = $('tools-badge');
  if (badge) {
    if (n > 0) {
      badge.classList.remove('hidden');
      badge.textContent = String(n);
      badge.style.background = fails ? 'var(--err)' : 'var(--blue)';
    } else {
      badge.classList.add('hidden');
    }
  }
  const railBadge = $('tools-rail-badge');
  if (railBadge) {
    if (n > 0 && toolsCollapsed) {
      railBadge.classList.remove('hidden');
      railBadge.textContent = String(n);
      railBadge.classList.toggle('fail', fails > 0);
    } else {
      railBadge.classList.add('hidden');
    }
  }
  // compact chip in chat for current turn tools
  const chip = document.getElementById('tools-inline-chip');
  if (chip) {
    chip.classList.toggle('has-fail', fails > 0);
    chip.querySelector('.n').textContent = String(n);
    chip.querySelector('.lab').textContent =
      n === 0 ? '无工具' : (fails ? n + ' 工具 · ' + fails + ' 失败' : n + ' 工具调用');
  }
}

function prettyJson(v) {
  try {
    return JSON.stringify(v, null, 2);
  } catch (_) {
    return String(v);
  }
}

function renderToolsPanel() {
  const root = $('tools-list');
  if (!root) return;
  if (!toolEntries.length) {
    root.innerHTML =
      '<div class="tp-empty">本轮工具调用会显示在这里。<br>点击条目可展开参数与结果。</div>';
    updateToolsBadges();
    return;
  }
  root.innerHTML = '';
  // newest first for quick glance
  const list = toolEntries.slice().reverse();
  for (const t of list) {
    const open = toolsOpenIds.has(t.call_id);
    const st = t.status || 'started';
    const cls =
      'tp-item' +
      (open ? ' open' : '') +
      (st === 'failed' ? ' fail' : st === 'completed' ? ' ok' : ' run');
    const statusText =
      st === 'failed'
        ? ((t.error && (t.error.code || t.error.message)) || 'failed')
        : st === 'completed'
          ? 'completed'
          : 'running…';
    const item = document.createElement('div');
    item.className = cls;
    item.dataset.id = t.call_id;
    const head = document.createElement('button');
    head.type = 'button';
    head.className = 'tp-item-head';
    head.innerHTML =
      '<span class="dot"></span>' +
      '<span class="body">' +
      '<div class="name">' + MD.esc(t.name || '?') + '</div>' +
      '<div class="status-line">' + MD.esc(statusText) + '</div>' +
      '</span>' +
      '<span class="chev">›</span>';
    head.onclick = () => {
      if (toolsOpenIds.has(t.call_id)) toolsOpenIds.delete(t.call_id);
      else toolsOpenIds.add(t.call_id);
      renderToolsPanel();
    };
    item.appendChild(head);
    const body = document.createElement('div');
    body.className = 'tp-item-body';
    let html = '';
    if (t.arguments && Object.keys(t.arguments).length) {
      html +=
        '<div class="tp-sec"><div class="tp-sec-label">arguments</div>' +
        '<pre class="tp-pre">' + MD.esc(prettyJson(t.arguments)) + '</pre></div>';
    }
    if (st === 'failed' && t.error) {
      html +=
        '<div class="tp-sec"><div class="tp-sec-label">error</div>' +
        '<div class="tp-err">' +
        MD.esc((t.error.code || '') + (t.error.message ? ' — ' + t.error.message : '')) +
        '</div></div>';
    }
    if (t.output !== undefined && t.output !== null) {
      html +=
        '<div class="tp-sec"><div class="tp-sec-label">output</div>' +
        '<pre class="tp-pre">' + MD.esc(prettyJson(t.output)) + '</pre></div>';
    }
    if (!html) {
      html = '<div class="tp-sec"><div class="tp-sec-label">status</div><div class="tp-err" style="color:var(--muted)">' +
        MD.esc(statusText) + '</div></div>';
    }
    body.innerHTML = html;
    item.appendChild(body);
    root.appendChild(item);
  }
  updateToolsBadges();
}

function ensureToolsInlineChip() {
  let chip = document.getElementById('tools-inline-chip');
  if (chip) return chip;
  chip = document.createElement('button');
  chip.type = 'button';
  chip.id = 'tools-inline-chip';
  chip.className = 'tool-inline-summary';
  chip.innerHTML = '<span class="n">0</span> <span class="lab">工具调用</span> · 右侧详情';
  chip.onclick = () => {
    toolsCollapsed = false;
    applyToolsPanel();
  };
  const shell = document.querySelector('.msg.assistant:last-of-type');
  if (shell && shell.parentNode) {
    shell.parentNode.insertBefore(chip, shell.nextSibling);
  } else {
    $('chat-inner').appendChild(chip);
  }
  return chip;
}

function upsertTool(entry) {
  const id = entry.call_id || entry.name + '-' + String(toolEntries.length);
  entry.call_id = id;
  const idx = toolEntries.findIndex(t => t.call_id === id);
  if (idx >= 0) {
    toolEntries[idx] = { ...toolEntries[idx], ...entry };
  } else {
    toolEntries.push({ ts: Date.now(), ...entry });
  }
  ensureToolsInlineChip();
  // auto-open panel on first tool of a turn
  if (toolEntries.length === 1 && localStorage.getItem('ariadne_tools_panel') == null) {
    toolsCollapsed = false;
  }
  if (entry.status === 'failed') {
    toolsCollapsed = false; // surface failures
    toolsOpenIds.add(id);
  }
  applyToolsPanel();
  renderToolsPanel();
}

function setSessionId(id, { persist = true } = {}) {

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  if (Number.isNaN(d.getTime())) return '';
  const pad = n => String(n).padStart(2, '0');
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function clearChat() {

  inner.classList.add('has-empty');

function renderHistory(messages) {
  const inner = $('chat-inner');
  inner.innerHTML = '';
  inner.classList.remove('has-empty');
  if (!messages || !messages.length) {
    clearChat();
    return;
  }
  for (const m of messages) {
    if (m.role === 'user') addUserMsg(m.content || '');
    else if (m.role === 'assistant') {
      const shell = addAssistantShell();
      setAssistantMarkdown(shell, m.content || '', { streaming: false });
    }
  }
  scrollChat();
}

async function loadSessions() {
  const root = $('sess-list');
  root.innerHTML = '<div class="sb-empty">加载中…</div>';
  try {
    const list = await (await api('/api/sessions', { headers: authHeaders() })).json();
    root.innerHTML = '';
    if (!list.length) {
      root.innerHTML = '<div class="sb-empty">还没有历史。发一条消息后会出现在这里。</div>';
      return;
    }
    for (const s of list) {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'sess-row' + (s.session_id === sessionId ? ' active' : '');
      row.dataset.sid = s.session_id;
      const body = document.createElement('div');
      body.className = 'body';
      const title = s.title || s.preview || s.session_id;
      const src = s.title_source === 'user' ? '手动' : (s.title_source === 'auto' ? '自动' : '');
      body.innerHTML =
        '<div class="title-line">' + MD.esc(title) +
        (src ? '<span class="src">' + src + '</span>' : '') + '</div>' +
        '<div class="preview">' + MD.esc(s.preview || s.session_id) + '</div>' +
        '<div class="meta">' + (s.turns || 0) + ' 轮 · ' + MD.esc(fmtTime(s.mtime)) + '</div>';
      const del = document.createElement('span');
      del.className = 'del';
      del.textContent = '删';
      del.onclick = async (ev) => {
        ev.stopPropagation();
        if (!confirm('删除此会话？不可恢复。')) return;
        const r = await api('/api/sessions/' + encodeURIComponent(s.session_id), {
          method: 'DELETE', headers: authHeaders(),
        });
        if (!r.ok) return;
        if (s.session_id === sessionId) await createNewSession({ load: true });
        else loadSessions();
      };

      row.ondblclick = async (ev) => {
        ev.stopPropagation();
        const cur = s.title || s.preview || '';
        const next = prompt('会话标题（主题）', cur);
        if (next === null) return;
        const trimmed = next.trim();
        if (!trimmed) return;
        const r = await api('/api/sessions/' + encodeURIComponent(s.session_id), {
          method: 'PATCH', headers: authHeaders(),
          body: JSON.stringify({ title: trimmed }),
        });
        if (!r.ok) { alert((await r.json()).detail || 'rename failed'); return; }
        if (s.session_id === sessionId) updateTopTitle(trimmed);
        loadSessions();
      };

      row.onclick = async () => {
        if (s.session_id === sessionId) return;
        setSessionId(s.session_id);
        await loadSessionHistory(s.session_id);
        loadSessions();
        if (window.innerWidth <= 800) {
          sidebarCollapsed = true;
          applySidebar();
        }
      };
      row.appendChild(body);
      row.appendChild(del);
      root.appendChild(row);
    }
  } catch (e) {
    root.innerHTML = '<div class="sb-empty">加载失败</div>';
  }
}

async function loadPlugins() {
  const list = await (await api('/api/me/plugins', { headers: authHeaders() })).json();
  const root = $('plugins-body');
  root.innerHTML = '';
  for (const p of list) {
    const card = document.createElement('div');
    card.className = 'plugin-card';
    const head = document.createElement('div');
    head.className = 'head';
    head.innerHTML =
      '<strong>' + MD.esc(p.name) + '</strong>' +
      '<small style="color:var(--dim)">' + MD.esc(p.description) + '</small>' +
      (p.enabled
        ? '<span class="badge">已启用</span>'
        : '<span class="badge off">未启用</span>');
    card.appendChild(head);
    const inputs = {};
    const cfg = p.config || {};
    for (const key of p.required_config) {
      const wrap = document.createElement('div');
      wrap.className = 'field';
      wrap.style.marginTop = '8px';
      const lab = document.createElement('label');
      lab.textContent = key;
      const inp = document.createElement('input');
      const secret = /key|token|password|secret/i.test(key);
      const shown = cfg[key] || '';
      if (secret && shown) {
        inp.type = 'text';
        inp.value = shown;
        inp.spellcheck = false;
        inp.autocomplete = 'off';
        inp.style.fontFamily = 'var(--mono)';
        inp.title = '已脱敏；保持 ***** 可保留原密钥';
      } else if (secret) {
        inp.type = 'password';
        inp.placeholder = key;
        inp.autocomplete = 'new-password';
      } else {
        inp.type = 'text';
        inp.placeholder = key;
        if (shown) inp.value = shown;
      }
      wrap.appendChild(lab);
      wrap.appendChild(inp);
      card.appendChild(wrap);
      inputs[key] = inp;
    }
    const row = document.createElement('div');
    row.className = 'row';
    row.style.marginTop = '10px';
    const enableBtn = document.createElement('button');
    enableBtn.type = 'button';
    enableBtn.className = 'btn-primary';
    enableBtn.style.padding = '10px';
    enableBtn.textContent = p.enabled ? '更新' : '启用';
    enableBtn.onclick = async () => {
      const config = {};
      for (const k of p.required_config) config[k] = inputs[k].value;
      const r = await api('/api/me/plugins/' + p.name, {
        method: 'PUT', headers: authHeaders(), body: JSON.stringify({ config }),
      });
      if (!r.ok) alert((await r.json()).detail);
      loadPlugins();
    };
    row.appendChild(enableBtn);
    if (p.enabled) {
      const disableBtn = document.createElement('button');
      disableBtn.type = 'button';
      disableBtn.className = 'btn-secondary';
      disableBtn.style.padding = '10px';
      disableBtn.textContent = '停用';
      disableBtn.onclick = async () => {
        await api('/api/me/plugins/' + p.name, { method: 'DELETE', headers: authHeaders() });
        loadPlugins();
      };
      row.appendChild(disableBtn);
    }
    card.appendChild(row);
    root.appendChild(card);
  }
}

function setAssistantMarkdown(shell, text, { streaming = true } = {}) {
  const md = shell.querySelector('.md');
  const meta = shell.querySelector('.meta .status');
  if (streaming) {
    shell.classList.add('streaming');
    if (meta && !shell.dataset.hasAnswer) meta.textContent = '· 思考中';
    if (meta && shell.dataset.hasAnswer) meta.textContent = '· 生成中';
  } else {
    shell.classList.remove('streaming');
    if (meta) meta.textContent = '';
  }
  shell.dataset.raw = text || '';
  if (text) {
    md.classList.remove('placeholder');
    md.classList.add('has-text');
    md.innerHTML = MD.render(text);
  } else {
    md.classList.add('placeholder');
    md.classList.remove('has-text');
    md.innerHTML = streaming ? '…' : '<p>(empty reply)</p>';
  }
  scrollChat();
}

function setThinking(shell, text, { live = true, forceCollapse = false } = {}) {
  const box = shell.querySelector('[data-thinking]');
  if (!box) return;
  const body = box.querySelector('.thinking-body');
  const label = box.querySelector('.label');
  if (!text) {
    box.classList.add('hidden');
    return;
  }
  box.classList.remove('hidden');
  body.textContent = text;
  if (forceCollapse || !live) {
    box.classList.remove('live');
    box.classList.remove('open'); // collapsed by default after answer
    if (label) label.textContent = '已思考';
  } else {
    box.classList.add('live');
    box.classList.remove('open');
    if (label) label.textContent = '思考中';
  }
}

function addTool(name, status, detail, extra) {
  // Tools live in the right panel; chat only shows a compact summary chip.
  hideEmpty();
  const payload = {
    call_id: (extra && extra.call_id) || (name + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6)),
    name: name,
    status: status === 'started' ? 'started' : (status === 'failed' ? 'failed' : 'completed'),
    arguments: extra && extra.arguments,
    output: extra && extra.output,
    error: extra && extra.error,
  };
  if (status === 'failed' && detail && !payload.error) {
    payload.error = { code: detail, message: detail };
  }
  upsertTool(payload);
}

function createStreamRenderer(shell) {
  let full = '';
  let thinking = '';
  let pending = null;
  let lastPaint = 0;
  let sawAnswer = false;
  const paint = (force = false) => {
    const now = performance.now();
    if (!force && now - lastPaint < 40) {
      if (pending == null) {
        pending = requestAnimationFrame(() => {
          pending = null;
          lastPaint = performance.now();
          setAssistantMarkdown(shell, full, { streaming: true });
          if (thinking) setThinking(shell, thinking, { live: !sawAnswer });
        });
      }
      return;
    }
    if (pending != null) { cancelAnimationFrame(pending); pending = null; }
    lastPaint = now;
    setAssistantMarkdown(shell, full, { streaming: true });
    if (thinking) setThinking(shell, thinking, { live: !sawAnswer });
  };
  return {
    appendThinking(chunk) {
      thinking += chunk;
      // While only thinking (no answer yet), keep open/live
      setThinking(shell, thinking, { live: !sawAnswer });
      scrollChat();
    },
    append(chunk) {
      if (!sawAnswer && chunk) {
        sawAnswer = true;
        shell.dataset.hasAnswer = '1';
        // Answer started → collapse thinking (Grok/ChatGPT style)
        if (thinking) setThinking(shell, thinking, { live: false, forceCollapse: true });
      }
      full += chunk;
      paint(false);
    },
    set(text) {
      if (text) {
        sawAnswer = true;
        shell.dataset.hasAnswer = '1';
        if (thinking) setThinking(shell, thinking, { live: false, forceCollapse: true });
      }
      full = text || '';
      paint(true);
    },
    finish(fallbackText) {
      if (!full && fallbackText) full = fallbackText;
      if (pending != null) { cancelAnimationFrame(pending); pending = null; }
      setAssistantMarkdown(shell, full || '(empty reply)', { streaming: false });
      if (thinking) setThinking(shell, thinking, { live: false, forceCollapse: true });
      return full;
    },
    get text() { return full; },
    get thinking() { return thinking; },
  };
}

async function send() {
  if (busy) return;
  const text = $('input').value.trim();
  if (!text) return;
  $('input').value = '';
  autoSizeInput();
  busy = true;
  $('send').disabled = true;

  addUserMsg(text);
  clearToolsPanel();
  const shell = addAssistantShell();
  const stream = createStreamRenderer(shell);

  try {
    const payload = {
      input: text,
      session_id: sessionId,
      images: pendingImages.map(img => ({
        mime: img.mime,
        data_base64: img.data_base64,
        name: img.name,
      })),
    };
    const r = await fetch('/api/turns/stream', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!r.ok) {
      let detail = '';
      try { detail = (await r.json()).detail || ''; } catch (_) {}
      stream.set('ERROR ' + r.status + (detail ? ': ' + detail : ''));
      stream.finish();
      return;
    }
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        let ev;
        try { ev = JSON.parse(line.replace(/^data:\s?/, '')); } catch (_) { continue; }
        if (ev.kind === 'model_thinking_delta') {
          stream.appendThinking(String((ev.data && ev.data.text) || ''));
        } else if (ev.kind === 'model_delta') {
          stream.append(String((ev.data && ev.data.text) || ''));
        } else if (ev.kind === 'tool_started') {
          addTool(ev.data.name, 'started', '', {
            call_id: ev.data.call_id || '',
          });
        } else if (ev.kind === 'tool_completed') {
          addTool(
            ev.data.name,
            ev.data.status || 'completed',
            (ev.data.error && ev.data.error.code) || '',
            {
              call_id: ev.data.call_id || '',
              arguments: ev.data.arguments,
              output: ev.data.output,
              error: ev.data.error,
            }
          );
        } else if (ev.kind === 'guard_finding') {
          addTool('guard:' + ev.data.direction, 'failed', ev.data.detail, {
            error: { code: 'GUARD', message: ev.data.detail || '' },
          });
        } else if (ev.kind === 'turn_completed' || ev.kind === 'turn_failed') {
          if (ev.error && ev.error.message) {
            stream.set('**' + (ev.error.code || 'ERROR') + '**\n\n' + ev.error.message);
            stream.finish();
            if (ev.error.code === 'ARIADNE_MULTIMODAL_UNSUPPORTED') {
              addTool('multimodal', 'failed', '模型不支持图片', {
                error: {
                  code: ev.error.code,
                  message: '模型不支持图片 — 可移除附件或换 vision 模型 / ARIADNE_VISION=on',
                },
              });
            }
          } else {
            const res = ev.result;
            if (res) {
              if (!stream.text && res.text) stream.set(res.text);
              stream.finish(res.text || '');
              if (res.status !== 'completed') {
                addTool('turn', 'failed', (res.error && res.error.code) || 'failed', {
                  error: res.error || { code: 'failed', message: 'turn failed' },
                });
              }
            } else stream.finish();
          }
        }
      }
    }
    stream.finish();
    pendingImages = [];
    renderAttachBar();
    await refreshSessionTitle(false);
    loadSessions();
  } catch (err) {
    stream.set('ERROR: ' + (err && err.message ? err.message : String(err)));
    stream.finish();
  } finally {
    busy = false;
    $('send').disabled = false;
    $('input').focus();
  }
}


function modelLikelyVision(model) {
  return /vision|gpt-4o|gpt-4\.1|gpt-5|claude-3|claude-4|gemini|llava|qwen|longcat|glm-4v|pixtral/i.test(model || '');
}
function renderAttachBar() {
  const bar = $('attach-bar');
  if (!bar) return;
  bar.innerHTML = '';
  if (!pendingImages.length) return;
  const model = ($('provider-status') && $('provider-status').textContent) || '';
  if (!modelLikelyVision(model) && !pendingImages._warned) {
    // soft client hint; server is authoritative
  }
  pendingImages.forEach((img, idx) => {
    const chip = document.createElement('div');
    chip.className = 'img-chip' + (modelLikelyVision(model) ? '' : ' warn-chip');
    chip.innerHTML =
      '<img alt="" src="' + img.preview + '">' +
      '<span>' + MD.esc(img.name) + '</span>';
    const rm = document.createElement('button');
    rm.type = 'button';
    rm.textContent = '×';
    rm.title = '移除';
    rm.onclick = () => { pendingImages.splice(idx, 1); renderAttachBar(); };
    chip.appendChild(rm);
    bar.appendChild(chip);
  });
  if (pendingImages.length && !modelLikelyVision(model)) {
    const tip = document.createElement('div');
    tip.className = 'img-chip warn-chip';
    tip.textContent = '当前模型可能不支持图片；发送时将提示';
    bar.appendChild(tip);
  }
}
function addPendingImage(file) {
  return new Promise((resolve, reject) => {
    if (!file || !String(file.type || '').startsWith('image/')) {
      reject(new Error('not an image'));
      return;
    }
    if (pendingImages.length >= 4) {
      reject(new Error('max 4 images'));
      return;
    }
    if (file.size > 8 * 1024 * 1024) {
      reject(new Error('image too large (max 8MB)'));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result || '');
      const m = dataUrl.match(/^data:([^;]+);base64,(.+)$/);
      if (!m) { reject(new Error('read failed')); return; }
      pendingImages.push({
        mime: m[1],
        data_base64: m[2],
        name: file.name || 'paste.png',
        preview: dataUrl,
      });
      renderAttachBar();
      resolve();
    };
    reader.onerror = () => reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}

function autoSizeInput() {
  const el = $('input');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}

$('send').onclick = send;
$('input').addEventListener('input', autoSizeInput);
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
$('input').addEventListener('paste', async e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  let got = false;
  for (const it of items) {
    if (it.type && it.type.startsWith('image/')) {
      const f = it.getAsFile();
      if (!f) continue;
      got = true;
      try { await addPendingImage(f); }
      catch (err) { alert(err.message || String(err)); }
    }
  }
  if (got) e.preventDefault();
});
// drag-drop images onto composer
const composer = $('composer');
if (composer) {
  composer.addEventListener('dragover', e => { e.preventDefault(); });
  composer.addEventListener('drop', async e => {
    e.preventDefault();
    const files = e.dataTransfer && e.dataTransfer.files;
    if (!files) return;
    for (const f of files) {
      if (!String(f.type || '').startsWith('image/')) continue;
      try { await addPendingImage(f); }
      catch (err) { alert(err.message || String(err)); }
    }
  });
}


const topTitle = document.querySelector('.topbar .title');
if (topTitle) {
  topTitle.onclick = async () => {
    if (!sessionId) return;
    const cur = topTitle.textContent === 'Ariadne' ? '' : topTitle.textContent;
    const next = prompt('会话标题（主题总结）\n留空并确定可自动重总结', cur);
    if (next === null) return;
    if (!String(next).trim()) {
      await refreshSessionTitle(true);
      return;
    }
    const r = await api('/api/sessions/' + encodeURIComponent(sessionId), {
      method: 'PATCH', headers: authHeaders(),
      body: JSON.stringify({ title: String(next).trim() }),
    });
    if (!r.ok) { alert((await r.json()).detail || 'failed'); return; }
    updateTopTitle((await r.json()).title);
    loadSessions();
  };
}
if (token) enter().catch(() => logout());
</script>
